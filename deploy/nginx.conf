# KawsayMath - Configuración Nginx para Oracle Cloud
# Copiar a: /etc/nginx/sites-available/mathflow
# Enlazar: sudo ln -s /etc/nginx/sites-available/mathflow /etc/nginx/sites-enabled/
# Reemplazar mathflow.example.com por tu dominio o IP pública de Oracle.

server {
    listen 80;
    listen [::]:80;
    server_name mathflow.example.com;

    root /var/www/mathflow/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Seguridad
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
}
